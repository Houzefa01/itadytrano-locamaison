spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/locamaison}
spring.datasource.username=${DB_USERNAME:locamaison}
spring.datasource.password=${DB_PASSWORD:password123}

spring.jpa.properties.hibernate.default_schema=public
# Le schema est geré exclusivement par Flyway. Hibernate se contente de valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# Configuration Upload Photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Répertoire de stockage des fichiers uploadés (HORS du code source : ne disparaît
# plus à chaque rebuild/redéploiement). En production, pointer vers un volume
# persistant ou un point de montage objet (S3/MinIO via gateway).
app.upload-dir=${UPLOAD_DIR:uploads}

# Actuator : exposer un healthcheck pour les sondes de déploiement.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# IMPORTANT: definir JWT_SECRET via variable d'environnement (>= 32 octets).
# Aucun secret par defaut n'est commite : si JWT_SECRET est absent (dev),
# une cle aleatoire ephemere est generee au demarrage (voir JwtUtil).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuration Email (Gmail SMTP recommandé)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nomenjanaharyflorancia@gmail.com}
# Ne mettez JAMAIS votre mot de passe réel ici. Utilisez un "Mot de passe d'application" Gmail.
# Il est recommandé de passer cette valeur via une variable d'environnement : SPRING_MAIL_PASSWORD
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notifications : SMS uniquement. L'e-mail est désactivé par défaut
# (mettre EMAIL_ENABLED=true pour le réactiver).
app.email.enabled=${EMAIL_ENABLED:false}

# Serialization Page stable JSON structure
spring.data.web.pageable.serialization-page-implementation-default=VIA_DTO

# Passerelle de paiement : secret partagé pour authentifier les webhooks de
# confirmation (Orange Money / Mvola...). À définir en production.
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}

# Orange SMS API configuration
orange.api.client.id=${ORANGE_CLIENT_ID:}
orange.api.client.secret=${ORANGE_CLIENT_SECRET:}
orange.api.sender.number=${ORANGE_SENDER_NUMBER:}
